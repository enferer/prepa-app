spring:
  application:
    name: prepa-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/prepa}
    username: ${DB_USER:prepa}
    password: ${DB_PASSWORD:prepa}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

prepa:
  web:
    # Origines autorisees a appeler l'API depuis un navigateur, separees par des virgules.
    # Depend du deploiement : le poste de developpement n'a pas la meme que le serveur.
    origines-autorisees: ${PREPA_ORIGINES:http://localhost:*,https://*}
  auth:
    jwt-secret: ${JWT_SECRET:dev-secret-a-remplacer-absolument-en-production-256bits}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
  crypto:
    # cle AES-256 en base64 — generer avec: openssl rand -base64 32
    key: ${CRYPTO_KEY:VDJxegfsPjsEgg2IckmuevFoNSVln87r1HZe6puV/FI=}

logging:
  level:
    app.prepa: DEBUG
