# Deploiement sur le serveur.
#
#   exploitation/deploiement.sh
#
# Les valeurs sensibles viennent d'un fichier .env place a cote, jamais du depot.
# Voir .env.prod.example et DEPLOIEMENT.md.
#
# Cette machine heberge deja un autre service, qui occupe le port 80. Rien ici ne s'y
# lie : l'application est publiee sur WEB_PORT (8080 par defaut). Les limites de memoire
# ne sont pas decoratives — avec 2 Go partages, un conteneur qui grossit sans borne
# ferait tomber le voisin.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-prepa}
      POSTGRES_USER: ${DB_USER:-prepa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?mot de passe de base requis}
    command: >
      postgres -c shared_buffers=96MB -c work_mem=4MB
               -c max_connections=30 -c effective_cache_size=256MB
    volumes:
      # Pas de montage vers les sauvegardes : pg_dump ecrit sur sa sortie standard,
      # et un repertoire cree par Docker appartiendrait a root — la sauvegarde
      # planifiee, elle, ne tourne pas en root.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-prepa} -d ${DB_NAME:-prepa}"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    # Aucun port publie : seul le reseau interne de la composition y accede.

  api:
    build:
      context: ./prepa-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-prepa}
      DB_USER: ${DB_USER:-prepa}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?secret JWT requis}
      CRYPTO_KEY: ${CRYPTO_KEY:?cle de chiffrement requise}
      SPRING_PROFILES_ACTIVE: prod
      # Un seul coeur : le ramasse-miettes parallele coute plus qu'il ne rapporte.
      JAVA_OPTS: -Xms128m -Xmx420m -XX:+UseSerialGC -XX:MaxMetaspaceSize=160m
    mem_limit: 700m
    expose:
      - "8080"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PREPA_API_URL: http://api:8080
      PREPA_SERVICE_KEY: ${WORKER_SERVICE_KEY:?cle de service du worker requise}
      # Passage complet toutes les 30 minutes ; les demandes immediates sont relevees
      # toutes les 5 minutes entre deux passages.
      PREPA_INTERVALLE_COMPLET_S: ${SYNC_INTERVALLE_S:-1800}
    volumes:
      - garmin-tokens:/data/garmin-tokens
    mem_limit: 256m

  web:
    build:
      context: ./prepa-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    mem_limit: 128m

volumes:
  pgdata:
  garmin-tokens:
